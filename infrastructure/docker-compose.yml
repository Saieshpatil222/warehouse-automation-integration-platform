  services:
    postgres:
      image: postgres:17
      container_name: waip-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: waip
        POSTGRES_USER: waip
        POSTGRES_PASSWORD: waip_local_dev
      ports:
        - "5432:5432"
      volumes:
        - waip-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U waip -d waip" ]
        interval: 5s
        timeout: 3s
        retries: 10

  volumes:
    waip-postgres-data:
